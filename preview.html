<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEVEN - Screen preview</title>
  <style>
    :root { --red: #b71923; --ink: #171717; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ecebe8; color: var(--ink); font: 14px/1.4 Inter, Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 20px; background: #fff; border-bottom: 1px solid #ddd; }
    header strong { color: var(--red); font-size: 18px; letter-spacing: -.02em; }
    header a, button { padding: 9px 14px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font: 600 12px Inter, Arial, sans-serif; letter-spacing: .06em; text-decoration: none; cursor: pointer; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    main { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; padding: 24px 20px 60px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; font-weight: 600; }
    figcaption span { color: #777; font-weight: 400; }
    .frame { overflow: hidden; background: #fff; border-radius: 10px; box-shadow: 0 18px 40px -26px rgba(0,0,0,.45); }
    iframe { display: block; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <header>
    <strong>SEVEN · Screen preview</strong>
    <div class="tabs" id="tabs"></div>
    <a href="admin.html">← ADMIN</a>
  </header>
  <main id="frames"></main>
  <script src="preview.js?v=70"></script>
</body>
</html>
